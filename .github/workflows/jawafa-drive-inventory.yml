name: Jawafa Drive inventory verification
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # No export verification is possible without a configured Google identity.
      # Fail closed before checkout or dependency installation.
      - name: Validate federation configuration
        env:
          WIF_PROVIDER: ${{ vars.JAWAFA_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.JAWAFA_WIF_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WIF_PROVIDER" || -z "$WIF_SERVICE_ACCOUNT" ]]; then
            echo "::error title=Google OIDC not configured::Configure JAWAFA_WIF_PROVIDER and JAWAFA_WIF_SERVICE_ACCOUNT as Actions repository variables; see docs/jawafa-drive-setup.md. Export remains NOT VERIFIED."
            exit 1
          fi
          if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "::error title=Invalid WIF provider::JAWAFA_WIF_PROVIDER must be a full numeric-project workload identity provider name."
            exit 1
          fi
          if [[ ! "$WIF_SERVICE_ACCOUNT" =~ ^[^@[:space:]]+@[^@[:space:]]+\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error title=Invalid service account::JAWAFA_WIF_SERVICE_ACCOUNT must be a Google service-account email."
            exit 1
          fi
          echo 'Federation resource names are syntactically valid; authentication and Drive access still need independent verification.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth
      - name: Authenticate with Google Cloud using OIDC
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # verified upstream v2 commit
        with:
          workload_identity_provider: ${{ vars.JAWAFA_WIF_PROVIDER }}
          service_account: ${{ vars.JAWAFA_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify export privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python tools/jawafa_drive_readonly_verify.py > "$RUNNER_TEMP/private-verification.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/private-verification.json")); print("Tables:",d["inventory_count"],"Files:",d["drive_csv_count"],"Verified:",d["verified"])'
